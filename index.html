<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Gallery</title>
  <meta name="description" content="Photographer portfolio gallery">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800;900&family=Anuphan:wght@300;400;500;600;700&family=Noto+Sans+Thai:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="header__inner">
      <a class="brand" href="./">
        <img class="brand__logo" id="brandLogo" alt="" hidden>
        <span class="brand__wordmark">
          <span class="brand__name" id="brandName">shine</span>
          <span class="brand__tag" id="brandTag">SHOT STUDIO</span>
        </span>
      </a>
      <div class="search">
        <span class="search__icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </span>
        <input id="search" type="search" placeholder="ค้นหา…" autocomplete="off" aria-label="ค้นหารูป">
        <button type="button" id="searchClear" class="search__clear" aria-label="ล้างการค้นหา">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Demo banner -->
  <div id="banner" class="banner" style="display:none">
    <div class="banner__in">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="13"/><line x1="12" y1="16" x2="12" y2="16"/></svg>
      <span>โหมดตัวอย่าง — กำลังแสดงรูปเดโม ใส่ลิงก์ Google Drive ใน <b>assets/js/config.js</b> เพื่อดึงรูปจริง</span>
    </div>
  </div>

  <!-- Intro -->
  <section class="intro">
    <h1 class="intro__mark">
      <span id="introTitle">shine</span>
      <span class="intro__tag" id="introTag">SHOT STUDIO</span>
    </h1>
    <div class="count" id="count"></div>
  </section>

  <!-- Category pills -->
  <nav class="cats"><div class="cats__inner" id="cats"></div></nav>

  <!-- Grid -->
  <main class="wrap"><div class="grid" id="grid"></div></main>

  <!-- Footer -->
  <footer class="foot">
    <div class="foot__name" id="footName">Gallery</div>
    <div class="foot__links" id="footLinks"></div>
    <div class="foot__copy">© <span id="year"></span> · Photographer Portfolio</div>
  </footer>

  <!-- Lightbox -->
  <div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="ดูภาพขนาดเต็ม">
    <div class="lb__spin" id="lbSpin" style="display:none"></div>
    <img class="lb__img" id="lbImg" alt="">
    <button type="button" class="lb__btn lb__close" id="lbClose" aria-label="ปิด">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <button type="button" class="lb__btn lb__prev" id="lbPrev" aria-label="ก่อนหน้า">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <button type="button" class="lb__btn lb__next" id="lbNext" aria-label="ถัดไป">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
    <div class="lb__bar">
      <span class="lb__cap" id="lbCap"></span>
      <span class="lb__count" id="lbCount"></span>
      <a class="lb__dl" id="lbDl" aria-label="ดาวน์โหลด" download>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      </a>
    </div>
  </div>

  <script src="./assets/js/config.js"></script>
  <script src="./assets/js/app.js"></script>
</body>
</html>
