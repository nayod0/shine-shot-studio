<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>SHINE SHOT studio · Photographer Portfolio</title>
  <meta name="description" content="SHINE SHOT studio — รับถ่ายภาพรับปริญญา พรีเวดดิ้ง และภาพบุคคล ดูผลงานทั้งหมดได้ที่นี่">

  <!-- Social share preview -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="SHINE SHOT studio">
  <meta property="og:title" content="SHINE SHOT studio · Photographer Portfolio">
  <meta property="og:description" content="รับถ่ายภาพรับปริญญา พรีเวดดิ้ง และภาพบุคคล — ผลงานจริงจากลูกค้า">
  <meta property="og:image" content="./assets/og-image.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="SHINE SHOT studio · Photographer Portfolio">
  <meta name="twitter:description" content="รับถ่ายภาพรับปริญญา พรีเวดดิ้ง และภาพบุคคล — ผลงานจริงจากลูกค้า">
  <meta name="twitter:image" content="./assets/og-image.jpg">
  <link rel="icon" type="image/png" href="./assets/favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800;900&family=Anuphan:wght@300;400;500;600;700&family=Noto+Sans+Thai:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="header__inner">
      <a class="brand" href="./">
        <img class="brand__logo" id="brandLogo" alt="" hidden>
        <span class="brand__wordmark">
          <span class="brand__name" id="brandName">shine</span>
          <span class="brand__tag" id="brandTag">SHOT STUDIO</span>
        </span>
      </a>
      <div class="search">
        <span class="search__icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </span>
        <input id="search" type="search" placeholder="ค้นหา…" autocomplete="off" aria-label="ค้นหารูป">
        <button type="button" id="searchClear" class="search__clear" aria-label="ล้างการค้นหา">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Hero cover -->
  <section class="hero" id="hero" hidden>
    <img class="hero__img" id="heroImg" alt="">
    <div class="hero__overlay"></div>
    <div class="hero__content">
      <p class="hero__text" id="heroText"></p>
      <a href="#grid" class="hero__cta">ดูผลงานทั้งหมด ↓</a>
    </div>
  </section>

  <!-- Demo banner -->
  <div id="banner" class="banner" style="display:none">
    <div class="banner__in">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="13"/><line x1="12" y1="16" x2="12" y2="16"/></svg>
      <span>โหมดตัวอย่าง — กำลังแสดงรูปเดโม ใส่ลิงก์ Google Drive ใน <b>assets/js/config.js</b> เพื่อดึงรูปจริง</span>
    </div>
  </div>

  <!-- Intro -->
  <section class="intro">
    <h1 class="intro__mark">
      <span id="introTitle">shine</span>
      <span class="intro__tag" id="introTag">SHOT STUDIO</span>
    </h1>
    <div class="count" id="count"></div>
  </section>

  <!-- Category pills -->
  <nav class="cats"><div class="cats__inner" id="cats"></div></nav>

  <!-- Grid -->
  <main class="wrap"><div class="grid" id="grid"></div></main>

  <!-- Footer -->
  <footer class="foot">
    <div class="foot__name" id="footName">Gallery</div>
    <div class="foot__links" id="footLinks"></div>
    <div class="foot__copy">© <span id="year"></span> · Photographer Portfolio</div>
  </footer>

  <!-- Lightbox -->
  <div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="ดูภาพขนาดเต็ม">
    <div class="lb__spin" id="lbSpin" style="display:none"></div>
    <img class="lb__img" id="lbImg" alt="">
    <button type="button" class="lb__btn lb__close" id="lbClose" aria-label="ปิด">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <button type="button" class="lb__btn lb__prev" id="lbPrev" aria-label="ก่อนหน้า">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <button type="button" class="lb__btn lb__next" id="lbNext" aria-label="ถัดไป">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
    <div class="lb__bar">
      <span class="lb__cap" id="lbCap"></span>
      <span class="lb__count" id="lbCount"></span>
      <button type="button" class="lb__fav" id="lbFav" aria-label="เลือกรูปนี้ไว้">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6c-1.7-1.7-4.4-1.7-6.1 0L12 7.3 9.3 4.6c-1.7-1.7-4.4-1.7-6.1 0-1.7 1.7-1.7 4.4 0 6.1L12 19l8.8-8.3c1.7-1.7 1.7-4.4 0-6.1z"/></svg>
      </button>
      <a class="lb__dl" id="lbDl" aria-label="ดาวน์โหลด" download>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      </a>
    </div>
  </div>

  <!-- Floating action buttons -->
  <div class="fabs" id="fabs">
    <button type="button" class="fab fab--fav" id="favTrigger" aria-label="รูปที่เลือกไว้" hidden>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6c-1.7-1.7-4.4-1.7-6.1 0L12 7.3 9.3 4.6c-1.7-1.7-4.4-1.7-6.1 0-1.7 1.7-1.7 4.4 0 6.1L12 19l8.8-8.3c1.7-1.7 1.7-4.4 0-6.1z"/></svg>
      <span class="fab__badge" id="favBadge" hidden>0</span>
    </button>
    <div class="fab-contact" id="contactFab" hidden>
      <div class="fab-contact__menu" id="contactMenu"></div>
      <button type="button" class="fab fab--contact" id="contactTrigger" aria-label="ติดต่อเรา">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      </button>
    </div>
  </div>

  <!-- Favorites panel -->
  <div class="favpanel" id="favPanel">
    <div class="favpanel__backdrop" id="favBackdrop"></div>
    <div class="favpanel__sheet">
      <div class="favpanel__head">
        <h3>รูปที่เลือกไว้ <span id="favCount">0</span></h3>
        <button type="button" class="lb__btn favpanel__close" id="favClose" aria-label="ปิด">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="favpanel__list" id="favList"></div>
      <div class="favpanel__actions">
        <button type="button" class="favpanel__btn favpanel__btn--primary" id="favCopy">คัดลอกรายชื่อรูป</button>
        <button type="button" class="favpanel__btn" id="favClear">ล้างทั้งหมด</button>
      </div>
    </div>
  </div>

  <script src="./assets/js/config.js"></script>
  <script src="./assets/js/app.js"></script>
</body>
</html>
